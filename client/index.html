<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rizo-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F7FA" />
    <meta name="description" content="RIZO Service: sotuvdan keyingi xizmat, ta’mirlash va o‘rnatish so‘rovlarini kuzatish." />
    <meta property="og:title" content="RIZO Service" />
    <meta property="og:description" content="Ta’mirlash va o‘rnatish so‘rovlaringiz holatini onlayn kuzating." />
    <meta property="og:image" content="/rizo-logo.png" />
    <link rel="apple-touch-icon" href="/rizo-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved theme before the page paints so there is no flash of the wrong colours.
      (function () {
        try {
          var mode = localStorage.getItem("rizo_theme") || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <title>RIZO Service</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
